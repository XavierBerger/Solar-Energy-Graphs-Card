name: CI

# push covers every branch; the pull_request trigger adds the merge-commit
# check on requests targeting main, at the cost of a duplicate run for those.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solar-energy-graphs-card:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # dev.sh runs Node inside the Podman image pinned in Containerfile.
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build solar energy graphs card
        run: ./dev.sh build

      - name: Test solar energy graphs card
        run: ./dev.sh test
