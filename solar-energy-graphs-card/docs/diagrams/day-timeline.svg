  <path d="M545.5,528 v8 H860.5 v-8" fill="none" stroke="#4b9a42" stroke-width="1.5"/>
  <text x="80" y="554" font-size="13">history/history_during_period: now - 15 min .. now, then live states from hass</text>
  <text x="80" y="572" font-size="12" fill="#6b7280">only states after rawStart are drawn; the latest one before it seeds the line</text>
  <text x="80" y="594" font-size="12" fill="#6b7280">A raw value is carried forward for 10 min at most (MAX_POWER_STALENESS_SECONDS), then the line breaks.</text>
  <circle cx="90" cy="308.5" r="4" fill="#3b82f6"/><text x="100" y="312.5" font-size="12">statistics mean</text>
